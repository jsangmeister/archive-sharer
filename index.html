<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive Sharer</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1976d2" />
  <link rel="icon" href="icons/icon-192x192.png" />
  <script>
    if ('serviceWorker' in navigator) {
      // Relativer Pfad, Service Worker kontrolliert diese Seite
      navigator.serviceWorker.register('service-worker.js', { scope: './' });
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.body.appendChild(document.createTextNode(window.location.href));
    });
    const params = new URLSearchParams(window.location.search);
    const urlText = params.get('url') || params.get('text');
    if (urlText) {
      const url = new URL(urlText);
      url.search = '';
      window.open(`https://archive.ph/newest/${url.toString()}`, '_blank');
    }
  </script>
</head>
<body>
  <h1>Archive Sharer</h1>
  <p>Share-Target für URLs. Geteilte URLs werden im Browser geöffnet.</p>
</body>
</html>
