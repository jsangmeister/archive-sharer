<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive Sharer</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1976d2" />
  <link rel="icon" href="icons/icon-192x192.png" />
  <script>
    if ('serviceWorker' in navigator) {
      // Relativer Pfad, Service Worker kontrolliert diese Seite
      navigator.serviceWorker.register('service-worker.js', { scope: './' });
    }
    document.body.appendChild(document.createElement('p', { textContent: window.location.href }));
    const params = new URLSearchParams(window.location.search);
    params.forEach((value, key) => {
      document.body.appendChild(document.createElement('p', { textContent: `${key}: ${value}` }));
    });
    const url = params.get('url');
    if (url) {
      window.location.href = url;
    }
  </script>
</head>
<body>
  <h1>Archive Sharer</h1>
  <p>Share-Target für URLs. Geteilte URLs werden im Browser geöffnet.</p>
</body>
</html>
